<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Ápices - APICCA COMUN">

    <meta property="og:image" content="https://apicca.com/img/social-share.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="img/favicon_io/site.webmanifest">
    <link rel="stylesheet" href="css/styles.css">

<body>
    <header>
        <div class="logo">
            <a href="/">
                <img src="img/apicca_logo.png" alt="apicca logo" class="logo-img">
            </a>
        </div>
        <div class="menu-container">
            <button class="menu-toggle" aria-label="Menu">
                <span class="menu-bar"></span>
                <span class="menu-bar"></span>
                <span class="menu-bar"></span>
            </button>
            <nav>
                <ul>
                    <li><a href="/">Inicio</a></li>
                    <li><a href="/apices" class="active">Ápices</a></li>
                    <li><a href="/resetario">Re(s)etario</a></li>
                    <li><a href="/contacto">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="apices-main">
        <section class="apices-section">
            <div class="apices-header">
                <h1 class="page-title">ápices</h1>
            </div>

            <div class="cube-container">
                <div class="cube glass-cube">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face bottom"></div>

                    <div class="cube-soil"></div>

                    <div class="cube-branches">
                        <svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
                            <g transform="translate(250, 600)">
                                <!-- Ramas y raíces estilo vector retro-industrial (tamaño aumentado x1.5) -->
                                <path d="M 0,0 C 0,-75 -30,-150 -30,-270 C -30,-330 -60,-390 -45,-465" fill="none"
                                    stroke="#e53000" stroke-width="9" stroke-linecap="square" />
                                <path d="M -30,-150 C -60,-195 -120,-210 -165,-255" fill="none" stroke="#e53000"
                                    stroke-width="6" stroke-linecap="square" />
                                <path d="M -30,-270 C -15,-330 30,-360 60,-420" fill="none" stroke="#ff5500"
                                    stroke-width="7" stroke-linecap="square" />

                                <path d="M 15,0 C 30,-90 15,-180 60,-285 C 105,-390 75,-495 90,-540" fill="none"
                                    stroke="#1c1c1c" stroke-width="12" stroke-linecap="square" />
                                <path d="M 60,-285 C 105,-285 150,-330 180,-390" fill="none" stroke="#1c1c1c"
                                    stroke-width="7" stroke-linecap="square" />

                                <path d="M -15,0 C -45,-60 -75,-120 -75,-195 C -75,-270 -135,-330 -150,-420" fill="none"
                                    stroke="#999999" stroke-width="10" stroke-linecap="square" />
                                <path d="M -75,-195 C -105,-195 -135,-240 -180,-225" fill="none" stroke="#999999"
                                    stroke-width="6" stroke-linecap="square" />

                                <!-- Pequeños nodos rectangulares para el look de hardware EP-133 -->
                                <rect x="-51" y="-471" width="12" height="12" fill="#e53000" />
                                <rect x="-169" y="-259" width="9" height="9" fill="#e53000" />
                                <rect x="54" y="-426" width="12" height="12" fill="#ff5500" />
                                <rect x="82" y="-548" width="15" height="15" fill="#1c1c1c" />
                                <rect x="176" y="-394" width="9" height="9" fill="#1c1c1c" />
                                <rect x="-157" y="-427" width="14" height="14" fill="#999999" />
                                <rect x="-184" y="-229" width="8" height="8" fill="#999999" />
                            </g>
                        </svg>
                    </div>
                    <div class="cube-branches alt">
                        <svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
                            <g transform="translate(250, 600) scale(-1, 1)">
                                <path d="M 0,0 C 0,-75 -30,-150 -30,-270 C -30,-330 -60,-390 -45,-465" fill="none"
                                    stroke="#e53000" stroke-width="9" stroke-linecap="square" />
                                <path d="M -30,-150 C -60,-195 -120,-210 -165,-255" fill="none" stroke="#e53000"
                                    stroke-width="6" stroke-linecap="square" />
                                <path d="M -30,-270 C -15,-330 30,-360 60,-420" fill="none" stroke="#ff5500"
                                    stroke-width="7" stroke-linecap="square" />
                                <path d="M 15,0 C 30,-90 15,-180 60,-285 C 105,-390 75,-495 90,-540" fill="none"
                                    stroke="#1c1c1c" stroke-width="12" stroke-linecap="square" />
                                <path d="M 60,-285 C 105,-285 150,-330 180,-390" fill="none" stroke="#1c1c1c"
                                    stroke-width="7" stroke-linecap="square" />
                                <path d="M -15,0 C -45,-60 -75,-120 -75,-195 C -75,-270 -135,-330 -150,-420" fill="none"
                                    stroke="#999999" stroke-width="10" stroke-linecap="square" />
                                <path d="M -75,-195 C -105,-195 -135,-240 -180,-225" fill="none" stroke="#999999"
                                    stroke-width="6" stroke-linecap="square" />
                                <rect x="-51" y="-471" width="12" height="12" fill="#e53000" />
                                <rect x="-169" y="-259" width="9" height="9" fill="#e53000" />
                                <rect x="54" y="-426" width="12" height="12" fill="#ff5500" />
                                <rect x="82" y="-548" width="15" height="15" fill="#1c1c1c" />
                                <rect x="176" y="-394" width="9" height="9" fill="#1c1c1c" />
                                <rect x="-157" y="-427" width="14" height="14" fill="#999999" />
                                <rect x="-184" y="-229" width="8" height="8" fill="#999999" />
                            </g>
                        </svg>
                    </div>
                </div>

                <div class="apices-info">
                </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <span class="footer-text">Apoyan:</span>

                </a>
                <a href="https://labosquescuela.org" target="_blank" rel="noopener noreferrer">
                    <img src="img/labosquescuela_logo.png" alt="LaBosquescuela UBA" class="supporter-logo-2">
                </a>
            </div>
        </div>
    </footer>

    <script type="module" src="js/scripts.js"></script>
</body>

</html>

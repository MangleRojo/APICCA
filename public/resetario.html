<body class="te-resetario te-home">
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <!-- Screen reader announcements -->
    <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <header>
        <div class="logo">
            <a href="/">
                <img src="img/apicca_logo.png" alt="apicca logo" class="logo-img">
            </a>
        </div>
        <div class="menu-container">
            <button class="menu-toggle" aria-label="Menú">
                <span class="menu-bar"></span>
                <span class="menu-bar"></span>
                <span class="menu-bar"></span>
            </button>
            <nav>
                <ul>
                    <li><a href="/apices">Ápices</a></li>
                    <li><a href="/resetario" class="active">Re(s)etario</a></li>
                    <li><a href="/biblioteca">Biblioteca</a></li>
                    <li><a href="/contacto">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <div class="page-container">
            <h1 class="sr-only">Re(s)etario</h1>

            <!-- Device chassis tipo K.O. II -->
            <aside class="device" aria-hidden="true" id="ko-ii-device">

                <div class="device-branding">re(s)etario</div>
                <!-- Top I/O status bar -->
                <header class="device-io">
                    <span class="io-pill is-on" id="io-input">input</span>
                    <span class="io-pill" id="io-output">output</span>
                    <span class="io-pill io-pill-with-btn" id="io-sync">
                        <button type="button" class="orange-btn" aria-label="Sync Button" id="device-btn-sync"></button>
                        sync
                    </span>
                    <span class="io-pill io-pill-with-btn" id="io-print">
                        <button type="button" class="orange-btn" aria-label="Print Button" id="device-btn-print"></button>
                        print
                    </span>
                    <span class="io-pill"></span>
                    <span class="io-pill io-pill-with-btn" id="io-api">
                        <button type="button" class="orange-btn" aria-label="API Button" id="device-btn-api"></button>
                        api
                    </span>
                    <span class="io-pill is-on">power</span>
                </header>

                <div class="device-screen">
                    <div id="ko-ii-status" class="ko-ii-status" role="status" aria-live="polite"></div>
                    <div class="screen-meta">
                        <span>bar</span>
                        <span>fx</span>
                        <span>q</span>
                    </div>
                    <div class="screen-display">
                        <!-- La pantalla muestra la tarjeta de info o de eje -->
                    </div>
                    <div class="tactics-nav">
                        <button type="button" id="resetario-ai-tactics-prev" class="tactics-nav-button" aria-label="Táctica anterior" disabled>‹</button>
                        <span id="resetario-ai-tactics-counter" class="tactics-counter">0 / 0</span>
                        <button type="button" id="resetario-ai-tactics-next" class="tactics-nav-button" aria-label="Siguiente táctica" disabled>›</button>
                    </div>
                    <div class="screen-rec" aria-hidden="true"></div>
                </div>

                <!-- Function row: KEYS / FADER / EDIT / COPY / LOOP / PITCH / TIME -->
                <div class="device-functions">
                    <button type="button" class="fn-key">I</button>
                    <button type="button" class="fn-key">II</button>
                    <button type="button" class="fn-key is-active">III</button>
                    <button type="button" class="fn-key">IV</button>
                    <button type="button" class="fn-key">V</button>
                    <button type="button" class="fn-key">VI</button>
                    <button type="button" class="fn-key">VII</button>
                </div>

                <!-- Pad grid (5×2) -->
                <div class="device-pads">
                    <button type="button" class="pad tp7-eje-button" data-led="blue" data-eje="agua"><span class="pad-num">1</span><span class="pad-label">agua</span></button>
                    <button type="button" class="pad tp7-eje-button" data-led="green" data-eje="alimento"><span class="pad-num">2</span><span class="pad-label">alimento</span></button>
                    <button type="button" class="pad tp7-eje-button" data-led="yellow" data-eje="cobijo"><span class="pad-num">3</span><span class="pad-label">cobijo</span></button>
                    <button type="button" class="pad tp7-eje-button" data-led="red" data-eje="energia"><span class="pad-num">4</span><span class="pad-label">energía</span></button>
                    <button type="button" class="pad tp7-eje-button" data-led="orange" data-eje="comunicacion"><span class="pad-num">5</span><span class="pad-label">comunicación</span></button>

                    <button type="button" class="pad pad-light" id="device-pad-esc"><span class="pad-num"></span><span class="pad-label">esc</span></button>
                    <button type="button" class="pad pad-rec"><span class="pad-num">●</span><span class="pad-label">re(s)et</span></button>
                    <button type="button" class="pad pad-light tp7-dimension-button" data-dimension="Tiempo"><span class="pad-num">a</span><span class="pad-label">tiempo</span></button>
                    <button type="button" class="pad pad-light tp7-dimension-button" data-dimension="Espacio"><span class="pad-num">b</span><span class="pad-label">espacio</span></button>
                    <button type="button" class="pad pad-light tp7-dimension-button" data-dimension="Información"><span class="pad-num">c</span><span class="pad-label">info</span></button>
                </div>

            </aside>

            <!-- Área de respuesta: aparece debajo del K.O. II -->
            <div id="ko-ii-output" class="ko-ii-output" hidden>
                <div id="resetario-ai-answer-text" class="resetario-ai-answer-text tactics-carousel"></div>
            </div>

            <!-- Estado oculto del formulario: los controles visibles viven en el K=-II -->
            <form id="resetario-ai-form" class="resetario-ai-form-headless" hidden aria-hidden="true">
                <input type="checkbox" name="dimension" value="Tiempo">
                <input type="checkbox" name="dimension" value="Espacio">
                <input type="checkbox" name="dimension" value="Información">
                <button type="submit" class="tp7-submit-button" tabindex="-1"></button>
                <button type="button" id="resetario-ai-esc" tabindex="-1"></button>
            </form>

            <section id="resetario-ai-answer" class="resetario-ai-answer-section" hidden>
                <div id="resetario-ai-response-text" class="resetario-ai-answer-text"></div>
            </section>

        </div>
    </main>

    <section class="sponsors-section">
        <div class="sponsors-content">
            <p class="footer-beca-text">Gracias a la Beca para la Realización de<br>Laboratorios de Co-Creación de Objetos Digitales Expandidos 2025</p>
            <div class="sponsors-logos">
                <img src="img/pde_logo_negro.png" alt="Propuesta Ganadora PDE" class="sponsor-logo">
                <img src="img/aqui_si_pasa_logo_negro.png" alt="Aquí Sí Pasa Bogotá" class="sponsor-logo">
                <img src="img/bogota_logo_negro.png" alt="Bogotá" class="sponsor-logo">

                    <img src="img/MangleRojo_logo.png" alt="MangleRojo ORG" class="supporter-logo-1">
                </a>
                <a href="https://labosquescuela.org" target="_blank" rel="noopener noreferrer">
                    <img src="img/labosquescuela_logo.png" alt="LaBosquescuela UBA" class="supporter-logo-2">
                </a>
            </div>
        </div>
    </footer>
